name: Main CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/calculadora

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm run test